name: Build & Push to Codeberg

on:
  push:
    branches: [main]
    paths: ["pkgs/**"]
  workflow_dispatch:
    inputs:
      package:
        description: "Package name to build"
        required: true
        type: string

env:
  SIGN_KEY_B64: ${{ secrets.SIGN_KEY_B64 }}
  SIGNED_BY: "Kurnias <adityakurnia@proton.me>"
  CODEBERG_REPO: https://codeberg.org/adityakurnias/CCVoid.git
  CODEBERG_BRANCH: binpkgs

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        
      # PERBAIKAN 1: Install dependencies DULU sebelum menggunakan git
      - name: Install dependencies
        run: xbps-install -Sy git curl xtools bsdtar
      
      # PERBAIKAN 2: Safe directory SETELAH git terinstall
      - name: Fix git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup signing key
        run: echo "$SIGN_KEY_B64" | base64 -d > /tmp/repo-key.pem && chmod 600 /tmp/repo-key.pem
      
      - name: Determine packages to build
        id: pkgs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "list=${{ inputs.package }}" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^pkgs/' | cut -d'/' -f2 | sort -u | tr '\n' ' ')
            echo "list=$CHANGED" >> $GITHUB_OUTPUT
          fi
          
          if [ -z "${{ steps.pkgs.outputs.list }}" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "No package templates changed. Skipping build."
            exit 0
          fi
      
      - name: Build packages
        if: steps.pkgs.outputs.list != ''
        run: |
          rm -rf /tmp/codeberg-binpkgs
          mkdir -p /tmp/codeberg-binpkgs
          
          for pkg in ${{ steps.pkgs.outputs.list }}; do
            echo ">>> Building $pkg..."
            ./builder "$pkg"
            
            cp void-packages/hostdir/binpkgs/${pkg}*.xbps /tmp/codeberg-binpkgs/ || {
              echo "Failed to find .xbps for $pkg"
              exit 1
            }
          done
      
      - name: Reindex & Sign for Codeberg
        if: steps.pkgs.outputs.list != ''
        run: |
          cd /tmp/codeberg-binpkgs
          xbps-rindex --force -cC -v .
          xbps-rindex --force -a -v *.xbps
          xbps-rindex --privkey /tmp/repo-key.pem --signedby "$SIGNED_BY" --sign .
      
      - name: Push binaries to Codeberg
        if: steps.pkgs.outputs.list != ''
        env:
          CB_TOKEN: ${{ secrets.CB_TOKEN }}
        run: |
          rm -rf /tmp/cb-repo
          git clone --depth 1 --single-branch --branch $CODEBERG_BRANCH \
            https://x-access-token:${CB_TOKEN}@codeberg.org/adityakurnias/CCVoid.git \
            /tmp/cb-repo
          
          git config --global --add safe.directory /tmp/cb-repo
          
          cp /tmp/codeberg-binpkgs/*.xbps /tmp/cb-repo/
          mkdir -p /tmp/cb-repo/repodata
          cp /tmp/codeberg-binpkgs/repodata/* /tmp/cb-repo/repodata/
          
          cd /tmp/cb-repo
          git config user.name "adityakurnias"
          git config user.email "adityakurnia@proton.me"
          git add .
          
          if ! git diff --cached --exit-code >/dev/null; then
            git commit -m "[ci] update binaries: ${{ steps.pkgs.outputs.list }}"
            git push origin $CODEBERG_BRANCH
            echo "Binaries pushed to Codeberg!"
          else
            echo "No binary changes detected. Skipping push."
          fi
